<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS API Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #f5f7fa; }
        .container { display: flex; height: 100vh; }
        .panel { width: 360px; padding: 20px; background: white; box-shadow: 2px 0 10px rgba(0,0,0,.15); z-index: 1000; overflow-y: auto; }
        h2 { margin-top: 0; color: #1769aa; }
        label { display: block; margin: 10px 0 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 15px; border: 0; border-radius: 4px; background: #1976d2; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #125ca1; }
        #map { flex: 1; }
        .result { margin-top: 15px; padding: 10px; background: #f1f8ff; border-radius: 4px; border: 1px solid #c9e2ff; white-space: pre-wrap; font-size: 13px; max-height: 250px; overflow-y: auto; }
        .status { margin-top: 10px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h2>📍 ค้นหาข้อมูลพื้นที่</h2>
        <label for="lat">Latitude</label>
        <input type="number" id="lat" step="any" placeholder="13.7563">
        
        <label for="lon">Longitude</label>
        <input type="number" id="lon" step="any" placeholder="100.5018">

        <button onclick="searchCoordinate()">🔍 ค้นหาข้อมูลพื้นที่</button>

        <div class="status" id="status"></div>
        <div class="result" id="result">คลิกบนแผนที่หรือกรอกพิกัดเพื่อค้นหา</div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ใช้ Nominatim API ของ OpenStreetMap (Reverse Geocoding)
    const API_URL = "https://nominatim.openstreetmap.org/reverse";
    const map = L.map("map").setView([13.7563, 100.5018], 10);
    let marker = null;

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    // คลิกบนแผนที่
    map.on("click", (e) => {
        updateInputs(e.latlng.lat, e.latlng.lng);
        searchCoordinate();
    });

    function updateInputs(lat, lon) {
        document.getElementById("lat").value = lat.toFixed(6);
        document.getElementById("lon").value = lon.toFixed(6);
    }

    function setMarker(lat, lon, text = "ตำแหน่งที่เลือก") {
        if (marker) marker.setLatLng([lat, lon]);
        else {
            marker = L.marker([lat, lon], { draggable: true }).addTo(map);
            marker.on("dragend", (e) => {
                const pos = e.target.getLatLng();
                updateInputs(pos.lat, pos.lng);
                searchCoordinate();
            });
        }
        marker.bindPopup(text).openPopup();
        map.setView([lat, lon], Math.max(map.getZoom(), 13));
    }

    async function searchCoordinate() {
        const lat = parseFloat(document.getElementById("lat").value);
        const lon = parseFloat(document.getElementById("lon").value);
        const status = document.getElementById("status");
        const result = document.getElementById("result");

        if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            status.innerHTML = "❌ พิกัดไม่ถูกต้อง";
            return;
        }

        setMarker(lat, lon);
        status.innerHTML = "⏳ กำลังดึงข้อมูล...";
        result.textContent = "กำลังโหลด...";

        try {
            // เรียกใช้ API (ระบุ format=json)
            const res = await fetch(`${API_URL}?lat=${lat}&lon=${lon}&format=json`);
            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
            
            const data = await res.json();
            status.innerHTML = "✅ ดึงข้อมูลสำเร็จ";
            
            // แสดงผลชื่อสถานที่และที่อยู่แบบอ่านง่าย + JSON ฉบับเต็ม
            const placeName = data.display_name || "ไม่พบข้อมูลชื่อสถานที่";
            result.textContent = `📍 ที่อยู่:\n${placeName}\n\n--- ข้อมูล JSON ---\n` + JSON.stringify(data, null, 2);
            marker.bindPopup(`<b>${data.name || 'ตำแหน่งที่เลือก'}</b><br>${placeName}`).openPopup();
        } catch (err) {
            console.error(err);
            status.innerHTML = "❌ เกิดข้อผิดพลาดในการดึงข้อมูล";
            result.textContent = err.message;
        }
    }

    // กด Enter ใน Input เพื่อค้นหา
    ['lat', 'lon'].forEach(id => {
        document.getElementById(id).addEventListener("keydown", (e) => e.key === "Enter" && searchCoordinate());
    });
</script>
</body>
</html>
